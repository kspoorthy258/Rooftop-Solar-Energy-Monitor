<text x="35" y="70" class="code"><tspan class="num">01</tspan><tspan dx="22">import java.util.Scanner;</tspan></text><text x="35" y="94" class="code"><tspan class="num">02</tspan><tspan dx="22"></tspan></text><text x="35" y="118" class="code"><tspan class="num">03</tspan><tspan dx="22">public class SolarEnergyMonitor {</tspan></text><text x="35" y="142" class="code"><tspan class="num">04</tspan><tspan dx="22">    public static void main(String[] args) {</tspan></text><text x="35" y="166" class="code"><tspan class="num">05</tspan><tspan dx="22"></tspan></text><text x="35" y="190" class="code"><tspan class="num">06</tspan><tspan dx="22">        Scanner sc = new Scanner(System.in);</tspan></text><text x="35" y="214" class="code"><tspan class="num">07</tspan><tspan dx="22"></tspan></text><text x="35" y="238" class="code"><tspan class="num">08</tspan><tspan dx="22">        System.out.println(&quot;ROOFTOP SOLAR ENERGY MONITOR&quot;);</tspan></text><text x="35" y="262" class="code"><tspan class="num">09</tspan><tspan dx="22">        System.out.println(&quot;-----------------------------&quot;);</tspan></text><text x="35" y="286" class="code"><tspan class="num">10</tspan><tspan dx="22"></tspan></text><text x="35" y="310" class="code"><tspan class="num">11</tspan><tspan dx="22">        System.out.print(&quot;Enter Solar Panel Voltage (V): &quot;);</tspan></text><text x="35" y="334" class="code"><tspan class="num">12</tspan><tspan dx="22">        double voltage = sc.nextDouble();</tspan></text><text x="35" y="358" class="code"><tspan class="num">13</tspan><tspan dx="22"></tspan></text><text x="35" y="382" class="code"><tspan class="num">14</tspan><tspan dx="22">        System.out.print(&quot;Enter Solar Panel Current (A): &quot;);</tspan></text><text x="35" y="406" class="code"><tspan class="num">15</tspan><tspan dx="22">        double current = sc.nextDouble();</tspan></text><text x="35" y="430" class="code"><tspan class="num">16</tspan><tspan dx="22"></tspan></text><text x="35" y="454" class="code"><tspan class="num">17</tspan><tspan dx="22">        // Calculate power</tspan></text><text x="35" y="478" class="code"><tspan class="num">18</tspan><tspan dx="22">        double power = voltage * current;</tspan></text><text x="35" y="502" class="code"><tspan class="num">19</tspan><tspan dx="22"></tspan></text><text x="35" y="526" class="code"><tspan class="num">20</tspan><tspan dx="22">        // Calculate energy for 1 hour</tspan></text><text x="35" y="550" class="code"><tspan class="num">21</tspan><tspan dx="22">        double energy = power * 1;</tspan></text><text x="35" y="574" class="code"><tspan class="num">22</tspan><tspan dx="22"></tspan></text><text x="35" y="598" class="code"><tspan class="num">23</tspan><tspan dx="22">        System.out.println(&quot;\n--- Solar Panel Details ---&quot;);</tspan></text><text x="35" y="622" class="code"><tspan class="num">24</tspan><tspan dx="22">        System.out.println(&quot;Voltage : &quot; + voltage + &quot; V&quot;);</tspan></text><text x="35" y="646" class="code"><tspan class="num">25</tspan><tspan dx="22">        System.out.println(&quot;Current : &quot; + current + &quot; A&quot;);</tspan></text><text x="35" y="670" class="code"><tspan class="num">26</tspan><tspan dx="22">        System.out.println(&quot;Power   : &quot; + power + &quot; W&quot;);</tspan></text><text x="35" y="694" class="code"><tspan class="num">27</tspan><tspan dx="22">        System.out.println(&quot;Energy  : &quot; + energy + &quot; Wh&quot;);</tspan></text><text x="35" y="718" class="code"><tspan class="num">28</tspan><tspan dx="22"></tspan></text><text x="35" y="742" class="code"><tspan class="num">29</tspan><tspan dx="22">        sc.close();</tspan></text><text x="35" y="766" class="code"><tspan class="num">30</tspan><tspan dx="22">    }</tspan></text><text x="35" y="790" class="code"><tspan class="num">31</tspan><tspan dx="22">}</tspan></text>
</svg>